<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>판다마켓</title>

  <link rel="stylesheet" href="./reset.css">
</head>

<body>

  <header class="header">
    <nav class="gnb">
      <a href="/" class="logo-link">
        <img
          src="./images/logo.png"
          alt="판다마켓"
          class="logo"
        >
      </a>

      <a href="/login" class="login-button">
        로그인
      </a>
    </nav>
  </header>


  <main>

    <section class="hero">
      <div class="hero-inner">

        <div class="hero-text">
          <h1>
            일상의 모든 물건을<br>
            거래해 보세요
          </h1>

          <a href="/items" class="primary-button">
            구경하러 가기
          </a>
        </div>

        <div class="hero-image-wrap">
          <img
            src="./images/hero.png"
            alt="판다마켓 캐릭터"
            class="hero-image"
          >
        </div>

      </div>
    </section>


    <section class="features">

      <article class="feature">

        <div class="feature-image-wrap">
          <img
            src="./images/feature1.png"
            alt="인기 상품"
            class="feature-image"
          >
        </div>

        <div class="feature-content">
          <span class="feature-label">Hot item</span>

          <h2>
            인기 상품을<br>
            확인해 보세요
          </h2>

          <p>
            가장 HOT한 중고거래 물품을<br>
            판다 마켓에서 확인해 보세요
          </p>
        </div>

      </article>


      
      <article class="feature feature-reverse">

        <div class="feature-image-wrap">
          <img
            src="./images/feature2.png"
            alt="상품 검색"
            class="feature-image"
          >
        </div>

        <div class="feature-content feature-content-right">
          <span class="feature-label">Search</span>

          <h2>
            구매를 원하는<br>
            상품을 검색하세요
          </h2>

          <p>
            구매하고 싶은 물품은 검색해서<br>
            쉽게 찾아보세요
          </p>
        </div>

      </article>

      <article class="feature">

        <div class="feature-image-wrap">
          <img
            src="./images/feature3.png"
            alt="상품 등록"
            class="feature-image"
          >
        </div>

        <div class="feature-content">
          <span class="feature-label">Register</span>

          <h2>
            판매를 원하는<br>
            상품을 등록하세요
          </h2>

          <p>
            어떤 물건이든 판매하고 싶은 상품을<br>
            쉽게 등록하세요
          </p>
        </div>

      </article>

    </section>


    <section class="bottom-banner">

      <div class="bottom-banner-inner">

        <div class="bottom-banner-text">
          <h2>
            믿을 수 있는<br>
            판다마켓 중고 거래
          </h2>
        </div>

        <div class="bottom-banner-image-wrap">
          <img
            src="./images/bottom.png"
            alt="판다마켓 중고 거래"
            class="bottom-banner-image"
          >
        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="footer-inner">

      <p class="copyright">
        ©codeit - 2024
      </p>


      <div class="footer-links">
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>


      <div class="social-links">

        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="페이스북"
        >
            <img
          src="./images/facebook.png"
          alt="페이스북"
          class="social-icon"
        >

        <a
          href="https://twitter.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="트위터"
        >
           <img
          src="./images/twitter.png"
          alt="트위터"
          class="social-icon"
        >

        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="유튜브"
        >
          <img
          src="./images/youtube.png"
          alt="유튜브"
          class="social-icon"

        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="인스타그램"
        >
          <img
          src="./images/instagram.png"
          alt="인스타그램"
          class="social-icon"
      </div>

    </div>

  </footer>

</body>
</html>
