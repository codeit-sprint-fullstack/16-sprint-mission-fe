<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                 <img 
                src="판다마켓 로고+텍스트.png" 
                alt="판다마켓 로고">
            </a>
        </div>
    </header>
    <main>
        <section class="input-box">
            <div class="email-section">
                <p class="email">이메일</p>
                <input type="email" placeholder="이메일을 입력해주세요">
            </div>
            <div class="nickname-section">
                <p class="nickname">닉네임</p>
                <input type="nickname" placeholder="닉네임을 입력해주세요">
            </div>
            <div class="password-section">
                <p class="password">비밀번호</p>
                <input type="password" placeholder="비밀번호를 입력해주세요">
            </div>
            <div class="check-section">
                <p class="check">비밀번호 확인</p>
                <input type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
            </div>
        </section>
    </main>
    <p class="signup-button">회원가입</p>
    <div class="social-login">
        <P class="social-login-text">간편 로그인하기</P>
        <nav class="social-logo">
            <div class="google">
                <a href="https://www.google.com/">
                    <img 
                    src="구글.png" 
                    alt="구글로고">
                </a>
            </div>
            <div class="kakao">
                <a href="https://www.kakaocorp.com/page/">
                    <img 
                    src="카카오톡.png" 
                    alt="카카오로고">
                </a>
            </div>
        </nav>
    </div>
    <div class="join-in">
        <p>이미 회원이신가요?</p>
        <a href="login.html">로그인</a>
    </div>
</body>
</html>
