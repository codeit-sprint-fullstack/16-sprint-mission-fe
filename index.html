        <nav class="navBar">

            <a class="btn-login" href="./login.html"><button>로그인</button></a>
        </nav>
    </header>
    <div class="outer-box box">
        <div class="card">
            <div class="card-text">
                <h1>
                    일상의 모든 물건을<br>거래해 보세요
                </h1>
                <a href="./items"><button>구경하러 가기</button></a>
            </div>
            <img src="assets/panda1.png" alt="판다 인사 이미지">
        </div>
    </div>
    <div class="inner-box">
        <div class="box-1 box">
            <div class="card">
                <img src="assets/img1.png" alt="쇼핑 이미지">
                <div class="card-text">
                    <h2>Hot item</h2>
                    <h1>인기 상품을<br>확인해 보세요</h1>
                    <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                </div>
            </div>
        </div>
        <div class="box-2 box">
            <div class="card">
                <img src="assets/img2.png" alt="검색 이미지">
                <div class="card-text">
                    <h2>Search</h2>
                    <h1>구매를 원하는<br>상품을 검색하세요</h1>
                    <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                </div>
            </div>
        </div>
        <div class="box-3 box">
            <div class="card">
                <img src="assets/img3.png" alt="상품 등록 이미지">
                <div class="card-text">
                    <h2>Register</h2>
                    <h1>판매를 원하는<br>상품을 등록하세요</h1>
                    <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                </div>
            </div>
        </div>
    </div>
    <div class="outer-box box">
        <div class="card">
            <div class="card-text">
                <h1>
                    믿을 수 있는<br>판다마켓 중고 거래
