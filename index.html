    <meta charset="UTF-8" />

  <body class="main-page">
    <header>
      <nav class="header-wrapper">
        <a class="logo" href="/">
          <img src="./image/logo.png" alt="로고" />
        </a>
        <a class="button button-login" href="/login.html">로그인</a>
      </nav>
    </header>

    <main>
      <section class="section-top">
        <div class="section-wrapper">
          <div class="panel-content">
            <h1 class="title">일상의 모든 물건을<br />거래해 보세요</h1>
            <a class="button button-goto" href="/items.html">구경하러 가기</a>
          </div>
          <div class="panel-image">
            <img src="./image/home_top.png" alt="상단 이미지" />
          </div>
        </div>
      </section>

      <section class="section-content">
        <div class="section-wrapper">
          <div class="panel-image">
            <img src="./image/home_1.png" alt="설명 이미지 1" />
          </div>
          <div class="panel-content">
            <div class="badge">Hot item</div>
            <h2 class="title">인기 상품을<br />확인해 보세요</h2>
            <p class="description">
              가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-content">
        <div class="section-wrapper reverse">
          <div class="panel-image">
            <img src="./image/home_2.png" alt="설명 이미지 2" />
          </div>
          <div class="panel-content">
            <div class="badge">Search</div>
            <h2 class="title">구매를 원하는<br />상품을 검색하세요</h2>
            <p class="description">
              구매하고 싶은 물품은 검색해서 쉽게 찾아보세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-content">
        <div class="section-wrapper">
          <div class="panel-image">
            <img src="./image/home_3.png" alt="설명 이미지 3" />
          </div>
          <div class="panel-content">
            <div class="badge">Register</div>
            <h2 class="title">판매를 원하는<br />상품을 등록하세요</h2>
            <p class="description">
              어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-bottom">
        <div class="section-wrapper">
          <div class="panel-content">
            <h2 class="title">믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <div class="panel-image">
            <img src="./image/home_bottom.png" alt="하단 이미지" />
          </div>
        </div>
      </section>
    </main>
