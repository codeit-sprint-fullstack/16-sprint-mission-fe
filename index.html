<!DOCTYPE html>
<html lang="kr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reset.css">

  <title>판다마켓</title>
</head>

<body>
       
    <header class="header">
        <nav class="nav">
            <a href="/" class="logo">
             <img src="images/logo.png" alt="판다마켓 로고">
             
            </a>

       <a href="/login" class="login-button">
            로그인
        </a>

        </nav>
    </header>


<main>

    <section class="panda">
        
        <div class="panda-inner">   
        <img src="images/panda1.png" alt="판다마켓 캐릭터">
            <div class="panda-text">

                <h1>일상의 모든 물건을<br>
                    거래해보세요
                </h1>

                <a href="/items">구경하러 가기</a>
            </div> 

            
        </div>
    </section>

    <section class="product">   
        <div class="product-inner">
        <img src="images/panda2.png" alt="판다마켓 소개">
            <div class="product-text">
        
                <p class="label">Hot item</p>

                <h2>인기 상품을<br>
                    확인해 보세요
                </h2>

                <p class="description">
                    가장 HOT한 중고거래 물품을<br>
                    판다 마켓에서 확인해 보세요
                </p>
            </div>    
        </div>                  
    </section>

    <section class="search">
        <div class="search-inner">
        <img src="images/panda3.png" alt="판다마켓 소개">
            <div class="search-text">
                <p class="label">Search</p>
                <h2>구매를 원하는<br>
                    상품을 검색하세요
                </h2>
                <p class="description">
                    구매하고 싶은 물품은 검색해서<br>
                    쉽게 찾아보세요
                </p>
            </div>
        </div>
                

    </section>

    <section class="register">
        <div class="register-inner">
            <img src="images/panda4.png" alt="판다마켓 소개">
            <div class="register-text">
                <p class="label">Register</p>
                <h2>판매를 원하는<br> 
                    상품을 등록하세요</h2>
               <p class="description">
                    어떤 물건이든 판매하고 싶은 상품을<br>
                    쉽게 등록하세요</p>
            </>
        </div>
    </section>

    <section class="trust">
        <div class="trust-inner">
            <img src="images/panda5.png" alt="판다마켓 소개">
            <div class="trust-text">
                <h2>믿을 수 있는 <br>
                    판다마켓 중고 거래
                </h2>
            </div>
        </div>
    </section>



<footer class="footer">
        <div class="footer-inner">  

            <p>@codeit - 2024</p> 

            <div class="footer-links">
                <a href="/privacy">Privacy Policy</a>    
                <a href="/faq">FAQ</a>  
            </div>  
            <div class="sns">
                <a href="https://www.facebook.com/" target="_blank">
                    <img src="images/fb.png" alt="facebook">
                </a>
                <a href="https://twitter.com/" target="_blank">
                    <img src="images/x.png" alt="twitter">
                </a>
                <a href="https://www.youtube.com/" target="_blank">
                    <img src="images/yt.png" alt="youtube">
                </a>
                <a href="https://www.instagram.com/" target="_blank">
                    <img src="images/ig.png" alt="instagram">
                </a>
            </div>    
        </div>
</footer>
