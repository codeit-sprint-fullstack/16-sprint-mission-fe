<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-sheet.css">
</head>
<body class="main">
   <header>
        <nav>
            <div class="nav-container">
                <a href="./">
                    <img src="images/logo.png" class="logo" alt="판다마켓 로고">
                </a>
                <a href="/login.html" class="login-button">로그인</a>
            </div>
         </nav>
   </header>

   <main>
        <div class="main-banner">
            <div class="banner-container">
                <div class="main-left"> 
                    <h1>일상의 모든 물건을
                        거래해 보세요</h1>
                    <a href="/items" class="items">구경하러 가기</a>
                </div>
                <img src="images/land.png" class="land" alt="판다가 서있는 모습">        
            </div>
        </div>

        <div class="function-container">
            <section class="hot-item">
                <div class="grey-box">
                    <img src="images/shopping.png" class="shopping" alt="판다가 물건을 고르는 모습"> 
                    <div class="text">
                        <p class="label">Hot item</p>
                        <h2>인기 상품을
                            확인해 보세요</h2>
                        <p class="detail">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                    </div>    
                </div>
            </section>
               
            <section class="search">
                <div class="grey-box">
                    <div class="text">
                        <p class="label">Search</p>
                        <h2>구매를 원하는
                            상품을 검색하세요</h2>
                        <p class="detail">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p> 
                    </div>
                    <img src="images/search.png" class="search-img" alt="돋보기로 탐색하는 모습"> 
                </div>
            </section>

            <section class="register">
                <div class="grey-box">
                    <img src="images/folder.png" class="folder" alt="여러가지 물건을 폴더 별로 분류하는 모습"> 
                    <div class="text">
                        <p class="label">Register</p>
                        <h2>판매를 원하는
                            상품을 등록하세요</h2>
                        <p class="detail">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p> 
                    </div>
                </div>
            </section>
        </div>

        <div class="bottom-banner">
            <div class="bottom-group">
                <p>믿을 수 있는 <br>
                    판다마켓 중고 거래</p>
                <img src="images/trade.png" class="trade" alt="판다 2마리가 중고거래 하는 모습">      
            </div>
        </div>
    </main>
    
   <footer>
        <!-- social-list를 footer-contents 안으로 이동했습니다 -->
        <div class="footer-contents">      
            <p class="copyright">©codeit-2024</p>
            
            <div class="privacy-faq">
                <a href="/privacy" class="privacy">Privacy Policy</a>
                <a href="/faq" class="faq">FAQ</a>
            </div>

            <ul class="social-list">
                <li class="facebook">
                    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                        <img src="images/facebook.png" alt="페이스북">
                    </a>
                </li>
                <li class="twitter">
                    <a href="https://x.com" target="_blank" rel="noopener noreferrer">
                        <img src="images/twitter.png" alt="트위터">
                    </a>
                </li>
                <li class="youtube">
                    <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
                        <img src="images/youtube.png" alt="유튜브">
                    </a>
                </li>
                <li class="insta">
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                        <img src="images/insta.png" alt="인스타그램">
                    </a>
                </li>
            </ul>
        </div>
   </footer>

</body>
</html>
