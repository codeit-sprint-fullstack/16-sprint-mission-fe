<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon"> 
  <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>
  <header>
    <nav class="gnb">
      <h1 class="logo"><a href="/">판다마켓</a></h1>
      <a href="/login" class="btn-login">로그인</a>
    </nav>
  </header>
  <main>
    <section class="banner-top">
      <div class="inner">
        <div class="txt-box">
          <p>일상의 모든 물건을<br>거래해 보세요</p>
          <a href="/items" class="btn-item">구경하러 가기</a>
        </div>
        <div class="img-box"><img src="./img/Img_home_top.png" alt="귀여운 판다 캐릭터가 인사를 하고 있는 일러스트"></div>
      </div>
    </section>
    <section class="banner">
      <div class="inner">
        <div class="img-box"><img src="./img/Img_home_01.png" alt="판다 캐릭터들이 인기가 많은 상품을 구경하는 일러스트"></div>
        <div class="txt-box">
          <p class="sub-title">Hot item</p>
          <p class="title">인기 상품을<br>확인해 보세요</p>
          <p class="text">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
        </div>
      </div>
    </section>
    <section class="banner">
      <div class="inner">
        <div class="img-box"><img src="./img/Img_home_02.png" alt="어떤 상품인지 돋보기를 들고 탐색하는 일러스트"></div>
        <div class="txt-box">
          <p class="sub-title">Search</p>
          <p class="title">구매를 원하는<br>상품을 검색하세요</p>
          <p class="text">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
        </div>
      </div>
    </section>
    <section class="banner">
      <div class="inner">
        <div class="img-box"><img src="./img/Img_home_03.png" alt="다양한 여러 상품들이 폴더와 함께 나열된 일러스트"></div>
        <div class="txt-box">
          <p class="sub-title">Register</p>
          <p class="title">판매를 원하는<br>상품을 등록하세요</p>
          <p class="text">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
        </div>
      </div>
    </section>
    <section class="banner-btm">
      <div class="inner">
        <div class="txt-box">
          <p>믿을 수 있는<br>판다마켓 중고 거래</p>
        </div>
        <div class="img-box"><img src="./img/Img_home_bottom.png" alt="귀여운 판다끼리 대화를 나누며 거래를 하는 모습의 일러스튼"></div>
      </div>
    </section>
  </main>
  <footer>
    <div class="inner">
      <p class="copy">©codeit - 2024</p>
      <ul class="fnb">
        <li><a href="/privacy">Privacy Policy</a></li>
        <li><a href="/faq">FAQ</a></li>
      </ul>
      <div class="sns-box">
        <a target="_blank" href="https://www.facebook.com/" class="ic-facebook">페이스북</a>
        <a target="_blank" href="https://x.com/" class="ic-twitter">트위터</a>
        <a target="_blank" href="https://www.youtube.com/" class="ic-youtube">유튜브</a>
        <a target="_blank" href="https://www.instagram.com/" class="ic-instagram">인스타그램</a>
      </div>
    </div>
  </footer>
</body>
</html>
