<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/signup.css">
    <title>판다마켓</title>
</head>

<body>
    <div class="signup-wrapper">
        <div class="signup-banner">
            <a href="../index.html">
                <div class="panda-logo">
                    <img class="panda-img" src="../asset/logo.png" alt="판다마켓">
                </div>
            </a>

            <form class="signup-banner-bottom-container" action="POST">
                <p>이메일</p>
                <input type="text">
                <p>닉네임</p>
                <input type="text">
                <p>비밀번호</p>
                <input type="password">
                <p>비밀번호 확인</p>
                <input type="password">
                <button class="signup-confirm" type="submit">회원가입</button>

                <div class="signup-banner-social-login">
                    <p class="social-signup-text">간편 회원가입</p>
                    <div class="social-signup-button-container">
                        <a href="https://www.google.com/" class="social-button">
                            <div>
                                <img class="signup-icon" src="../asset/Google.png" alt="구글">
                            </div>
                        </a>
                        <a href="https://www.kakaocorp.com/page/" class="social-button">
                            <div>
                                <img class="signup-icon" src="../asset/Kakao.png" alt="카카오">
                            </div>
                        </a>
                    </div>



                </div>
                <div class="old-user-info">
                    <p>이미 회원이신가요?</p> <a href="./login.html">
                        <p class="login-navigate">로그인</p>
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
