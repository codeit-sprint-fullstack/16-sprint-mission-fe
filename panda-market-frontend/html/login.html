<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>판다마켓</title>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-banner">
            <a href="../index.html">
                <div class="panda-logo">
                    <img class="panda-img" src="../asset/logo.png" alt="판다마켓">
                </div>
            </a>

            <form class="login-banner-bottom-container" method = "POST">
                <p>이메일</p>
                <input type="text">
                <p>비밀번호</p>
                <input type="password">
                <button class="login-confirm" type = "submit">로그인</button>
                <div class="login-banner-social-login">
                    <p class="social-login-text">간편 로그인하기</p>
                    <div class="social-login-button-container">
                        <a href="https://www.google.com/" class="social-button">
                            <div>
                                <img class = "login-icon" src="../asset/Google.png" alt="구글">
                            </div>
                        </a>
                        <a href="https://www.kakaocorp.com/page/" class="social-button">
                            <div>
                                <img class = "login-icon" src="../asset/Kakao.png" alt="카카오">
                            </div>
                        </a>
                    </div>

                </div>
                <div class="new-user-info">
                    <p>판다마켓이 처음이신가요?</p> <a href="./signup.html"><p class = "signup">회원가입</p></a>
                </div>
            </form>

        </div>
    </div>

</body>

</html>
