<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-02H8CMDDQX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-02H8CMDDQX");
    </script>
  </head>
  <body class="auth-page">
    <div class="auth-wrapper">
      <a class="logo" href="/">
        <img src="./image/logo.png" alt="로고" />
      </a>
      <form action="#" method="post">
        <label for="email">이메일</label>
        <input
          id="email"
          type="email"
          placeholder="이메일을 입력해주세요"
          autocomplete="email"
          required
        />
        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input
            id="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
            autocomplete="current-password"
            required
          />
          <button
            class="button button-visibility"
            type="button"
            aria-label="비밀번호 보이기"
          >
            <img src="./image/btn_visibility.svg" alt="비밀번호 보이기" />
          </button>
        </div>
        <button class="button button-login" type="submit">로그인</button>
      </form>
      <div class="login-oauth">
        <div class="login-oauth-text">간편 로그인하기</div>
        <ul class="oauth-list">
          <li>
            <a
              href="https://www.google.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="./image/login_google.svg" alt="구글 로그인" />
            </a>
          </li>
          <li>
            <a
              href="https://www.kakaocorp.com/page/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="./image/login_kakao.svg" alt="카카오 로그인" />
            </a>
          </li>
        </ul>
      </div>
      <footer>
        판다마켓이 처음이신가요? <a href="/signup.html">회원가입</a>
      </footer>
    </div>
  </body>
</html>
