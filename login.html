<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>판다마켓 로그인</title>
    
    <link rel="icon" href="./images/logo/favicon.ico" />
    
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
</head>
<body>

    <main>
        <section class="login_container">
            <h1>
                <a href="/"><img src="images/logo/panda-market-logo.png" alt="판다마켓 홈"/></a>
            </h1>
            <div class="login_form">
                <label class="login_text" for="userInput">이메일</label>
                <input class="login_input" type="text" id="userInput" placeholder="이메일을 입력해주세요">
                <label class="login_text" for="userInput">비밀번호</label>
                <input class="login_input" type="password" id="userInput" placeholder="비밀번호를 입력해주세요">
                <button class="login_button">로그인</button>
            </div>
            <div>

            <div class="oauth">
                <div class="oauth_title_container">
                    <h3 class="oauth_title">간편 로그인하기</h3>
                </div>
                <div class="oauth_icon_container">
                    <a href="https://google.com"><img class="oauth_icon" src="./images/logo/google_icon.png"></a>
                    <a href="https://kakaocorp.com/page"><img class="oauth_icon" src="./images/logo/kakao_icon.png"></a>
                </div>
            </div>
            
            <div class="sign-up">
                <div class="sign-up_text">
                    <div class="sign_up_title">판다마켓이 처음이신가요? </div><a href="/signup"><button class="sign-up_button">회원가입</button></a>
                </div>
            </div>
        </section>
    </main>
    
</body>

</html>
