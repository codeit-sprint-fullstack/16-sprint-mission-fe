<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>판다마켓</title>
</head>
<body>
  <div class="signup">
    <h1 class="logo">판다마켓</h1>

    <div class="input-box">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="이메일을 입력해주세요">
    </div>

    <div class="input-box">
      <label for="nickname">닉네임</label>
      <input type="nickname" id="nickname" placeholder="닉네임을 입력해주세요">
    </div>

    <div class="input-box">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placehodler="비밀번호를 입력해주세요">
    </div>
    
    <div class="input-box">
      <label for="password-check">비밀번호 확인</label>
      <input type="password" id="password-check" placeholder="비밀번호를 다시 입력해주세요">
    </div>

    <button class="btn" type="button">회원가입</button>
  </div>
  
</body>
</html>
