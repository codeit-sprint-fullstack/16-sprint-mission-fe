<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <title>Panda market Sign up</title>
</head>
<body>
    <main class="signup-page">
        <nav class="login-logo-box">
            <a href="/" class="login-logo"> 
             <img src="images/logo.png" alt="판다마켓 로고">
             </a>
        </nav>
        <section class="signup-input">
            <div class="email">
                <label for="email">이메일</label>
                <input id="email" type="email" 
                placeholder="이메일을 입력해주세요">
            </div>

            <div class="nickname">
                <label for="nickname">닉네임</label>
                <input id="nickname" type="text" 
                placeholder="닉네임을 입력해주세요">
            </div>

            <div class="password">
                <label for="password">비밀번호</label>
                <input id="password" type="password" 
                placeholder="비밀번호를 입력해주세요">
            </div>

            <div class="password-confirm">
                <label for="password-confirm">비밀번호 확인</label>
                <div class="password-input-box">
                    <input id="password-confirm" type="password" 
                    placeholder="비밀번호를 다시 한 번 입력해주세요">

                    <img class="eye-icon"
                    src="images/eye.png"
                    alt="비밀번호 보기">
                </div>
            </div>
        
            <a href="/signup" class="signup-page-button">
                회원가입
            </a>

        </section>


        <div class="login-simple">
            <p>간편 로그인하기</p>
            
            <div class="login-sns">
                <a href="https://www.google.com/">
                <img src="images/google.png" alt="Google">
                </a> 
                <a href="https://www.kakaocorp.com/page/" class="kakao-link"> 
                <img src="images/kakao.png" alt="kakao" 
                class="kakao-logo">
                <img src="images/kakao-out.png" alt="kakao" 
                class="kakao-bg">
                </a>
            </div>
        </div>

        <div class="signup-login">
            <p>이미 회원이신가요?</p>
            <a href="/login">로그인</a>
        </div>

    </main>
</body>
</html>
