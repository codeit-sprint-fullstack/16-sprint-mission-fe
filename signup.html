<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <title>회원가입 페이지</title>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E2DNE318L6"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-E2DNE318L6');
</script>
<body>
    <form action="">
        <a class="logo-img" href="./index.html">
            <img src="assets/logo-pandamarket.png" alt="판다마켓 로고">
        </a>
        <label for="username">이메일</label>
        <input type="text" id="username" name="username" placeholder="이메일을 입력해주세요" required>

        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요" required>

        <label for="password">비밀번호</label>
        <div class="input-pw">
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" required>
            <button class="btn-show-pw" type="button"><img src="assets/show-pw.png" alt="show password button"></button>
        </div>
        <label for="password-confirm">비밀번호 확인</label>
        <div class="input-pw">
            <input type="password" id="password-confirm" name="password-confirm" placeholder="비밀번호를 다시 한번 입력해주세요" required>
        <button class="btn-show-pw" type="button"><img src="assets/show-pw.png" alt="show password button"></button>
        </div>
        <button class="btn-login" type="submit">회원가입</button>

        <div class="social-login-box">
            <p>간편 로그인하기</p>
            <div class="social-login-buttons">
                <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><img src="assets/logo-google.png" alt="구글 로고"></a>
                <a href="https://www.kakao.com/" target="_blank" rel="noopener noreferrer"><img src="assets/logo-kkt.png" alt="카카오 로고"></a>
            </div>
        </div>

        <p class="register-box">
            이미 회원이신가요? <a href="./login.html">로그인</a>
        </p>
    </form>
</body>
</html>
