<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓 로그인</title>
  <link rel="stylesheet" href="../addboard/panda.css">
</head>
<body class="login-body">
  <header>
    <div class="header-container-login">
      <a href="/" class="login-logo">
        <img src="../img/Property 1=lg.png"
         alt="판다마켓 로그인 로고">
      </a>
    </div>

  </header>
  <main class="login-main">
    <form action="#" class="login-form">
      <div>
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일을 입력해주세요.">
      </div>

      <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력해주세요">
      </div>

      <button type="submit">로그인</button>
    </form>

    <div class="social-login">
      <p>간편 로그인하기</p>
      <div class="icons">
        <a href="https://www.google.com/"><img src="../img/google.png" 
          alt="구글로 로그인"></a>
        <a href="https://www.kakaocorp.com/"><img src="../img/kakao.png" 
          alt="카카오로 로그인"></a>
      </div>
    </div>
  </main>
  <footer class="login-footer">
    <p>판다마켓이 처음이신가요? <a href="../addboard/panda-sign-up.html">회원가입</a></p>
  </footer>
  
</body>
</html>
