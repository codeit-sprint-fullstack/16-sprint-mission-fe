<!DOCTYPE html>
<html lang="ko">

    <link rel="stylesheet" href="../css/mission2-2.css">
    
    <body>

    <section class="회원가입페이지">    

    <div class="판다마켓">     
    <a href="/">
    <img class="판다마켓로고" src="../미션2 이미지/판다마켓 로고.png" alt="판다마켓">
    </a>
    </div>

    <div class="이메일">
    <label class="이메일-1" for="email">이메일</label>
    <input class="이메일-2" id="email" type="email" placeholder="이메일을 입력해주세요">
    </div>

    <div class="닉네임">
    <label class="닉네임-1" for="nickname">닉네임</label>
    <input class="닉네임-2" id="nickname" type="text" placeholder="닉네임을 입력해주세요">
    </div>
   
    <div class="비밀번호">
    <label class="비밀번호-1" for="password">비밀번호</label>
    <input class="비밀번호-2" id="password" type="password" placeholder="비밀번호를 입력해주세요">
    </div>

    <div class="비밀번호확인">
    <label class="비밀번호확인-1" for="password-confirm">비밀번호 확인</label>
    <input class="비밀번호확인-2" id="password-confirm" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
    </div>

     
    <button class="회원가입">회원가입</button>

    <section class="간편로그인">
     <p>간편 로그인하기</p>
     <div class="로고이미지">
        <a class="구글링크" href="https://www.google.com/">
        <img class="구글로고" src="../미션2 이미지/구글로고.png">
        </a>
        <a class="카카오링크" href="https://www.kakaocorp.com/page">
        <img class="카카오톡로고" src="../미션2 이미지/카카오톡로고.png">
        </a>
     </div>
    </section>

    <div class="회원">
    <p>이미 회원이신가요?</p>
    <a class="로그인버튼" href="../login">로그인</a>
    </div>  

    </section>
    </body>   

</html>
