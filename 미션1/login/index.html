<!DOCTYPE html>
<html lang="ko">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>

   <link rel="stylesheet" href="../css/mission2-1.css">
   
   <body>
      <section class="로그인페이지">

      <div class="판다마켓">
      <a href="/">
      <img class="판다마켓로고" src="../미션2 이미지/판다마켓 로고.png" alt="판다마켓">
      </a>
      </div>

      <section class="이메일">
      <label class="이메일-1" for="email">이메일</label>
      <input class="이메일-2" id="email" type="email" placeholder="이메일을 입력해주세요">
      </section>

      <section class="비밀번호">
      <label class="비밀번호-1" for="password">비밀번호</label>
      <input class="비밀번호-2" id="password" type="password" placeholder="비밀번호를 입력해주세요">
      </section>  

      <button class="로그인버튼">로그인</button>

      <section class="간편로그인">
      <label for="간편로그인">간편 로그인하기</label>    
      <div class="로고이미지">
      <a href="https://www.google.com">  
      <img class="구글로고" src="../미션2 이미지/구글로고.png" alt="구글">
      </a>
      <a href="https://www.kakaocorp.com/page">
      <img class="카카오톡로고" src="../미션2 이미지/카카오톡로고.png" alt="카카오">
      </a>
      </div>
      </section>
 
      <div class="회원가입안내">
      <span>판다마켓이 처음이신가요?</span>
      <a class="회원가입버튼" href="../signup">회원가입</a>
      </div>   
   
      </section>
      
   </body>

</html>
